<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Pedikura - nega stopal</title>
  <desc id="desc">Bolj izrazita ilustracija pedikure z jasno obliko stopala, prsti in nohti.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9f0e5"/>
      <stop offset="100%" stop-color="#dcc0a1"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e7d6"/>
      <stop offset="100%" stop-color="#d9b898"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <ellipse cx="250" cy="160" rx="230" ry="108" fill="#fff6ed" opacity="0.58"/>
  <ellipse cx="935" cy="625" rx="225" ry="118" fill="#efd6be" opacity="0.56"/>

  <rect x="220" y="480" width="760" height="118" rx="26" fill="#7b5032"/>

  <ellipse cx="610" cy="430" rx="320" ry="112" fill="url(#bowl)"/>
  <ellipse cx="610" cy="416" rx="290" ry="88" fill="#f2e0cc"/>

  <!-- Foot shape -->
  <path d="M470 430c45-84 129-130 246-130c89 0 166 33 228 86c3 52-23 96-75 130c-88 50-256 50-337 5c-45-25-73-54-62-91Z" fill="#efd5bd"/>
  <path d="M480 432c42-72 123-112 230-112c80 0 151 28 208 74" fill="none" stroke="#dfc1a3" stroke-width="10" stroke-linecap="round"/>

  <!-- Toes -->
  <ellipse cx="870" cy="322" rx="24" ry="18" fill="#e8c8aa"/>
  <ellipse cx="910" cy="309" rx="22" ry="17" fill="#e8c8aa"/>
  <ellipse cx="948" cy="303" rx="20" ry="16" fill="#e8c8aa"/>
  <ellipse cx="982" cy="301" rx="18" ry="15" fill="#e8c8aa"/>
  <ellipse cx="1013" cy="303" rx="16" ry="14" fill="#e8c8aa"/>

  <!-- Toenails -->
  <rect x="856" y="336" width="22" height="11" rx="6" fill="#f5e6d5"/>
  <rect x="896" y="324" width="20" height="10" rx="5" fill="#f5e6d5"/>
  <rect x="934" y="319" width="18" height="9" rx="5" fill="#f5e6d5"/>
  <rect x="967" y="318" width="16" height="8" rx="4" fill="#f5e6d5"/>
  <rect x="998" y="320" width="14" height="7" rx="4" fill="#f5e6d5"/>

  <path d="M360 360c36-18 72-21 108-10c-14 39-43 67-91 82c-23-11-30-33-17-72Z" fill="#89ab74"/>
</svg>
