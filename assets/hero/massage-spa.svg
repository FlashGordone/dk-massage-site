<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Masaža v sprostitvenem spa ambientu</title>
  <desc id="desc">Topla gradientna ilustracija z masažno mizo, svečami in listi za wellness stran.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8efe3"/>
      <stop offset="50%" stop-color="#e7d3bd"/>
      <stop offset="100%" stop-color="#d9b996"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8f5f3d"/>
      <stop offset="100%" stop-color="#6f482d"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <ellipse cx="930" cy="180" rx="220" ry="120" fill="#fff4e8" opacity="0.55" filter="url(#soft)"/>
  <ellipse cx="240" cy="620" rx="260" ry="140" fill="#f3ddc5" opacity="0.45" filter="url(#soft)"/>

  <rect x="180" y="410" width="840" height="120" rx="28" fill="url(#table)"/>
  <rect x="250" y="350" width="520" height="82" rx="24" fill="#f7e9d9"/>
  <rect x="740" y="350" width="170" height="82" rx="24" fill="#edd9c2"/>

  <circle cx="920" cy="356" r="22" fill="#f2dfcb"/>
  <circle cx="965" cy="356" r="22" fill="#f2dfcb"/>
  <path d="M920 326c-7-12-6-24 2-36c8 11 9 24-2 36Z" fill="#8fb07a"/>
  <path d="M965 326c-8-10-8-22 1-33c8 10 9 22-1 33Z" fill="#6a8d57"/>

  <g opacity="0.95">
    <rect x="104" y="332" width="40" height="74" rx="8" fill="#d7a77f"/>
    <ellipse cx="124" cy="332" rx="17" ry="8" fill="#f1bf91"/>
    <path d="M124 300c-8 11-7 22 0 33c8-11 8-22 0-33Z" fill="#ffd9a8"/>

    <rect x="1060" y="332" width="40" height="74" rx="8" fill="#d7a77f"/>
    <ellipse cx="1080" cy="332" rx="17" ry="8" fill="#f1bf91"/>
    <path d="M1080 300c-8 11-7 22 0 33c8-11 8-22 0-33Z" fill="#ffd9a8"/>
  </g>

  <rect x="0" y="690" width="1200" height="110" fill="#caa37f" opacity="0.22"/>
</svg>
