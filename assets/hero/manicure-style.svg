<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Manikura</title>
  <desc id="desc">Jasna ilustracija manikure z roko in izrazito rdečimi nohti.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faefe4"/>
      <stop offset="100%" stop-color="#dcb899"/>
    </linearGradient>
    <linearGradient id="nailRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d9484f"/>
      <stop offset="100%" stop-color="#a91f2f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <ellipse cx="220" cy="650" rx="280" ry="120" fill="#f0d9c1" opacity="0.6"/>
  <ellipse cx="915" cy="180" rx="220" ry="100" fill="#fff6ed" opacity="0.55"/>

  <rect x="150" y="486" width="900" height="150" rx="30" fill="#7b4f31"/>

  <!-- Palm and wrist -->
  <path d="M210 500c112-118 253-176 426-176c126 0 245 34 354 98v96H210Z" fill="#f2dcc4"/>
  <path d="M230 506c104-108 236-162 397-162c120 0 232 32 334 91" fill="none" stroke="#e2c4a8" stroke-width="10" stroke-linecap="round"/>

  <!-- Fingers -->
  <rect x="666" y="274" width="64" height="165" rx="30" fill="#efcfb0"/>
  <rect x="738" y="254" width="64" height="188" rx="30" fill="#efcfb0"/>
  <rect x="810" y="246" width="64" height="196" rx="30" fill="#efcfb0"/>
  <rect x="882" y="258" width="64" height="184" rx="30" fill="#efcfb0"/>
  <path d="M604 390c18-58 56-92 113-104c22 35 25 70 8 105c-36 24-76 25-121-1Z" fill="#efcfb0"/>

  <!-- Red nails -->
  <rect x="676" y="248" width="44" height="30" rx="13" fill="url(#nailRed)"/>
  <rect x="748" y="228" width="44" height="30" rx="13" fill="url(#nailRed)"/>
  <rect x="820" y="220" width="44" height="30" rx="13" fill="url(#nailRed)"/>
  <rect x="892" y="232" width="44" height="30" rx="13" fill="url(#nailRed)"/>
  <rect x="664" y="324" width="30" height="20" rx="9" fill="url(#nailRed)"/>

  <!-- Polish bottle accent -->
  <rect x="980" y="364" width="48" height="86" rx="12" fill="#c03b46"/>
  <rect x="994" y="340" width="20" height="34" rx="6" fill="#2f2a26"/>
</svg>
